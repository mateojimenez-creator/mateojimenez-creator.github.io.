<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Title</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="script.js"></script>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous" />
    </head>
    <body>
        
        <div class="container-fluid row">
    <div id="header" class="container-fluid col-12"></div>
            <div class="col-12"><p></p></div>
            
            <div class="col-1"></div>
            <div id="carouselExampleCaptions" class="carousel slide col-4">
                <div class="carousel-indicators">
                    <button
                        type="button"
                        data-bs-target="#carouselExampleCaptions"
                        data-bs-slide-to="0"
                        class="active"
                        aria-current="true"
                        aria-label="Slide 1"></button>
                    <button
                        type="button"
                        data-bs-target="#carouselExampleCaptions"
                        data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                </div>
                <div class="carousel-inner rounded">
                    <div class="carousel-item active ">
                        <img
                            src="https://live.staticflickr.com/3219/2402443744_2f16a7e052_b.jpg"
                                 class="d-block w-100" />
                    </div>
                    <div class="carousel-item">
                        <img
                            src="https://pbs.twimg.com/media/Dnj8uJjUYAAgWbT.jpg"
                            class="d-block w-100" />
                    </div>
                    <div class="carousel-item">
                        <img
                            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTucYEY0rYF6hhXXgKH1j2JsOCp7siCPUSttg&s"
                            class="d-block w-100" />
                    </div>
                    
                </div>
                <button
                    class="carousel-control-prev"
                    type="button"
                    data-bs-target="#carouselExampleCaptions"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button
                    class="carousel-control-next"
                    type="button"
                    data-bs-target="#carouselExampleCaptions"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
            <div class="col-6">
                <h2>Zara</h2>
                <h4>Floor 1 & 2 | Department Store | Discover the new trendy collection | Monday to Sunday 10:00 to 9:00 hrs.</h4>
                <p>
                   Known for its fast-fashion collections for women, men, and children that follow the latest trends from global runways. Join the new fashion!             </p>
                <a
                        href="https://www.zara.com/mx/"
                   target="_blank"
                        class="btn btn-primary"
                        >More Information</a
                    >
            </div>
            <div class="col-1"></div>
            <div id="footer"></div>
            
        </div>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

        
       
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

            crossorigin="anonymous"></script>
    </body>
</html>
