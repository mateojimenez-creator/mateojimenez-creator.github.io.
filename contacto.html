<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="car.css">
    <meta charset="UTF-8">
    <title>Footer</title>
    <script src="script.js"></script>
        
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous" />
       <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        footer {
            background: #3d1f08;
            padding: 48px 40px 32px;
        }
        .footer-top {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1.4fr;
            gap: 32px;
            margin-bottom: 40px;
        }
        .footer-col h4 {
            color: #e8a22a;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin: 0 0 16px;
        }
        .footer-col a {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #c9a97a;
            font-size: 14px;
            text-decoration: none;
            margin-bottom: 10px;
            transition: color 0.15s;
        }
        .footer-col a i {
            font-size: 15px;
            color: #e8a22a;
        }
        .footer-col a:hover {
            color: #f0c158;
        }
        .footer-divider {
            border: none;
            border-top: 0.5px solid rgba(255, 255, 255, 0.12);
            margin: 0 0 32px;
        }
        .footer-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .footer-form input,
        .footer-form textarea {
            background: rgba(255, 255, 255, 0.07);
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #f5e8d0;
            font-size: 13px;
            padding: 9px 12px;
            font-family: Arial, sans-serif;
            outline: none;
            transition: border-color 0.15s;
            width: 100%;
            box-sizing: border-box;
        }
        .footer-form input::placeholder,
        .footer-form textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .footer-form input:focus,
        .footer-form textarea:focus {
            border-color: #e8a22a;
        }
        .footer-form textarea {
            resize: none;
            height: 72px;
        }
        .footer-btn {
            background: #e8a22a;
            color: #3d1f08;
            border: none;
            border-radius: 8px;
            padding: 9px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            align-self: flex-start;
            transition: background 0.15s;
        }
        .footer-btn:hover {
            background: #f0c158;
        }
        .footer-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        .footer-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .footer-brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #e8a22a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .footer-brand-icon i {
            font-size: 18px;
            color: #3d1f08;
        }
        .footer-brand-name {
            color: #f5e8d0;
            font-size: 15px;
            font-weight: 500;
        }
        .footer-tagline {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            text-align: center;
            flex: 1;
            margin: 0;
        }
        .footer-socials {
            display: flex;
            gap: 10px;
        }
        .footer-social {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: border-color 0.15s, background 0.15s;
        }
        .footer-social i {
            font-size: 16px;
            color: #c9a97a;
        }
        .footer-social:hover {
            border-color: #e8a22a;
            background: rgba(232, 162, 42, 0.1);
        }
        .footer-social:hover i {
            color: #e8a22a;
        }
        @media (max-width: 600px) {
            .footer-top {
                grid-template-columns: 1fr 1fr;
            }
            .footer-bottom {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
            <div id="header"></div>

<footer>
    <div class="footer-top">
        <div class="footer-col">
            <h4>About</h4>
            <a href="#"><i class="ti ti-building-store"></i> About us</a>
            <a href="#"><i class="ti ti-pencil"></i> Blog</a>
            <a href="#"><i class="ti ti-leaf"></i> Ingredients</a>
            <a href="#"><i class="ti ti-map-pin"></i> Branches</a>
        </div>
        <div class="footer-col">
            <h4>Information</h4>
            <a href="#"><i class="ti ti-headset"></i> Customer service</a>
            <a href="#"><i class="ti ti-tag"></i> Promotions</a>
            <a href="#"><i class="ti ti-file-text"></i> Terms</a>
        </div>
        <div class="footer-col">
            <h4>Help</h4>
            <a href="#"><i class="ti ti-message-circle"></i> Contact</a>
            <a href="#"><i class="ti ti-help-circle"></i> FAQ</a>
            <a href="#"><i class="ti ti-compass"></i> Location</a>
        </div>
        <div class="footer-col">
            <h4>Contact us</h4>
            <div class="footer-form">
                <input type="text" placeholder="Your name">
                <input type="email" placeholder="Your email">
                <textarea placeholder="Write your comments"></textarea>
                <button class="footer-btn"><i class="ti ti-send"></i> Send</button>
            </div>
        </div>
    </div>

    <hr class="footer-divider">

    
</footer>
<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
			crossorigin="anonymous"></script>
			<div id="footer"></div>
</body>
</html>
